<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ónix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --fondo: #000; --superficie: #0E0E0E; --borde: #262626; --texto: #DEDEDE; --tenue: #8A8A8A; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--fondo); color: var(--texto); font-family: Manrope, sans-serif; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 360px; text-align: center; }
  .marca { letter-spacing: 0.4em; font-size: 13px; color: var(--tenue); margin-bottom: 32px; }
  .portada { width: 100%; aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--borde);
             background: var(--superficie) center / cover no-repeat; margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 600; line-height: 1.3; }
  .artista { color: var(--tenue); font-size: 15px; margin-top: 4px; }
  .nota { color: var(--tenue); font-size: 13px; margin-top: 32px; line-height: 1.5; }
  a.boton { display: inline-block; margin-top: 16px; padding: 12px 24px; border: 1px solid #3A3A3A;
            border-radius: 12px; color: var(--texto); text-decoration: none; font-weight: 500; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="marca">ÓNIX</div>
  <div class="portada" id="portada"></div>
  <h1 id="titulo">Una canción</h1>
  <div class="artista" id="artista"></div>
  <p class="nota">Esta canción se abre con Ónix.</p>
  <a class="boton" id="abrir" href="#">Abrir en Ónix</a>
</main>
<script>
  // El link trae la canción: ?v=<id de YouTube>&t=<título>&a=<artista>. Si tienes Ónix, Android abre la app
  // directo y esta página ni se ve; si no, solo se muestra qué canción es.
  const q = new URLSearchParams(location.search);
  const v = q.get('v') || '';
  if (q.get('t')) document.getElementById('titulo').textContent = q.get('t');
  if (q.get('a')) document.getElementById('artista').textContent = q.get('a');
  if (/^[A-Za-z0-9_-]{6,}$/.test(v)) {
    document.getElementById('portada').style.backgroundImage = 'url("https://i.ytimg.com/vi/' + v + '/hqdefault.jpg")';
  }
  // Por si Android no lo abrió solo: este botón le pide a Android abrir Ónix con el mismo link.
  document.getElementById('abrir').href =
    'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=dev.moros.onix;end';
</script>
</body>
</html>
