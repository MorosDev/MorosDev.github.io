<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ónix</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #000; color: #8A8A8A; font-family: Manrope, sans-serif; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; text-align: center; }
  .marca { letter-spacing: 0.4em; font-size: 13px; color: #DEDEDE; margin-bottom: 16px; }
  p { font-size: 14px; margin: 0; }
</style>
</head>
<body>
<div>
  <div class="marca">ÓNIX</div>
  <p>Aquí solo viven los links de Ónix.</p>
</div>
<script>
  // Links nuevos (/c/<id>, /o/<código>) que llegaron aquí: se mandan a la casa nueva de Ónix.
  if (/^\/(c|o)\/[A-Za-z0-9_-]{6,}\/?$/.test(location.pathname)) location.replace('https://onixmusic.pages.dev' + location.pathname);
</script>
</body>
</html>
